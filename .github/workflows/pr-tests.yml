name: Artifact validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-validation:
    name: Artifact conflict markers and optional JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No conflict markers
        run: '! git grep -nE ''^(<<<<<<<|>>>>>>>) '' -- . '':!*.md'''
      - name: JSON syntax if tracked JSON exists
        run: git ls-files '*.json' | xargs -r -n1 python3 -m json.tool > /dev/null
