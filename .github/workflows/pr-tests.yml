name: PR Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-tests:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: No conflict markers or invalid JSON
      run: |
        ! git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.md'
        git ls-files '*.json' | xargs -r -n1 python3 -m json.tool > /dev/null
